<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="Form" class="Form">
        <h1>Form di Login</h1>
        <div id="Nominativo" class="Nominativo">
             <label>Nominativo</label>
             <input type="text" id="username">
        </div>

        <div id="Password" class="Password">
                <label>Password</label>
                <input type="password" id="password"> <button id="showPassword" class="showPassword">Show</button>
                    <div id="eyesContainer" class="eyesContainer">
                        <img src="gif/eyes.gif" class="eyesGif"> 
                    </div>
                </div>

        <div id="Anni" class="Anni">
            <label>Età</label>
            <input type="number" id="age">
        </div>

        <div id="Consenso" class="Consenso">
            <label>Consento l'utilizzo dei dati personali</label> <br>
            <input type="checkbox" id="consent" class="consent">
        </div>

        <div id="Invia" class="Invia">
            <button id="submit" class="submit">Invia</button>
        </div>
        <label id="errorUsername" class="error"></label>
        <label id="errorPassword" class="error"></label>
        <label id="errorAge" class="error"></label>
        <label id="errorConsent" class="error"></label>
        <script src="main.js"></script>
    </div>
</body>
</html>
