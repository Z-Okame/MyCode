<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="Form" class="Form">
        <h1>Preventivo Servizi</h1>
        
        <div id="NomeCompleto" class="NomeCompleto">
            <label>Nome completo</label>
            <input type="text" id="nomeCompleto">
        </div>

        <div id="Email" class="Email">
            <label>Email</label>
            <input type="text" id="email">
        </div>

        <div id="Telefono" class="Telefono">
            <label>Telefono</label>
            <input type="number" id="telefono">
        </div>

        <div id="Budget" class="Budget">
            <label>Budget</label>
            <input type="number" id="budget">
        </div>

        <div id="Servizi" class="Servizi">
            <h3>Servizi</h3>
            <div>
                <input type="checkbox" id="html" value="20">
                <label>HTML - €20/ora</label>
            </div>
            <div>
                <input type="checkbox" id="php" value="25">
                <label>PHP - €25/ora</label>
            </div>
            <div>
                <input type="checkbox" id="asp" value="30">
                <label>ASP - €30/ora</label>
            </div>
            <div>
                <input type="checkbox" id="java" value="35">
                <label>Java - €35/ora</label>
            </div>
            <div>
                <input type="checkbox" id="cpp" value="40">
                <label>C++ - €40/ora</label>
            </div>
        </div>

        <div id="Riepilogo" class="Riepilogo">
            <h3>Premi invio per il riepilogo</h3>
            <div id="riepilogoDati"></div>
        </div>

        <div id="Invia" class="Invia">
            <button id="submit" class="submit">Invia</button>
        </div>
        <script src="main.js"></script>
    </div>
</body>
</html>
