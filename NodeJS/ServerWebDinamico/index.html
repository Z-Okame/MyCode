<html>
<head>
  <title>Login Utente</title>
</head>
<body>
  <h1>Login con GET</h1>
  <form action="/login" name="datiGet" method="GET">
    Nome: <input type="text" name="nome" size="30"><br>
    Password: <input type="password" name="pass" size="30"><br>
    <input type="submit" value="Invia con GET">
  </form>

  <h1>Login con POST</h1>
  <form action="/login" name="datiPost" method="POST">
    Nome: <input type="text" name="nome" size="30"><br>
    Password: <input type="password" name="pass" size="30"><br>
    <input type="submit" value="Invia con POST">
  </form>
</body>
</html>
